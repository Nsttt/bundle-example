<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Release desk</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        --bg: #f4f5f7; --surface: #fff; --border: #d4d8de; --fg: #161a21; --muted: #5a6372;
        --pass: #1a7f37; --fail: #c2410c; --checking: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0e1116; --surface: #161b22; --border: #30363d; --fg: #e6edf3; --muted: #9aa5b1;
          --pass: #3fb950; --fail: #f0883e; --checking: #58a6ff; }
      }
      body { background: var(--bg); color: var(--fg); margin: 0; padding: 20px; }
      main { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 720px; }
      header { align-items: center; display: flex; gap: 12px; justify-content: space-between; }
      h1 { font-size: 20px; margin: 0; }
      #verdict { border-radius: 999px; font-size: 12px; font-weight: 700; padding: 4px 10px; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); }
      #verdict[data-state="ready"] { color: var(--pass); border-color: var(--pass); }
      #verdict[data-state="blocked"] { color: var(--fail); border-color: var(--fail); }
      #verdict[data-state="checking"] { color: var(--checking); border-color: var(--checking); }
      #summary { color: var(--muted); }
      ul { display: grid; gap: 10px; list-style: none; margin: 16px 0; padding: 0; }
      li { border-left: 3px solid var(--border); display: grid; gap: 2px; padding-left: 10px; }
      li[data-state="pass"] { border-color: var(--pass); }
      li[data-state="fail"] { border-color: var(--fail); }
      li span { color: var(--muted); font-size: 14px; }
      .actions { align-items: center; display: flex; gap: 8px; }
      select, button { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); font: inherit; padding: 6px 10px; }
      button { cursor: pointer; }
      #policy { color: var(--muted); font-size: 14px; white-space: pre-line; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="service">No service selected</h1>
        <span id="verdict" data-state="unknown">unknown</span>
      </header>
      <p id="summary">Run check-readiness to inspect a service.</p>
      <ul id="checks" aria-label="Release checks"></ul>
      <div class="actions">
        <label for="picker">Service</label>
        <select id="picker">
          <option value="api">api</option>
          <option value="web">web</option>
          <option value="worker">worker</option>
        </select>
        <button id="read-policy" type="button">Show release policy</button>
      </div>
      <p id="policy" aria-live="polite"></p>
    </main>
  </body>
</html>
